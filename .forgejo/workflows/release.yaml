# Builds and tests on every push to master; semantic-release (conventional commits) cuts a version, attaches the
# jar to a Forgejo release, and the jar of the latest release is published as a filesystem-only OCI image,
# git.illenium.net/<owner>/<repo>:<version>, that Keycloak mounts into /opt/keycloak/providers.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The job image ships Node but no JDK or Maven.
      - name: Toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends openjdk-21-jdk-headless maven >/dev/null
          java -version
          mvn -v

      - name: Test
        run: mvn -B verify

      - name: Semantic release
        env:
          GITEA_URL: https://git.illenium.net
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_CREDENTIALS: ${{ github.repository_owner }}:${{ secrets.RELEASE_TOKEN }}
        run: >-
          npx --yes -p semantic-release@24 -p @semantic-release/changelog@6 -p @semantic-release/exec@6
          -p @semantic-release/git@10 -p @saithodev/semantic-release-gitea@2 semantic-release

      # Publishes the latest release once; a run without a new release is a no-op here.
      - name: Provider image
        run: |
          image="git.illenium.net/${GITHUB_REPOSITORY}"
          git fetch --tags --force --quiet
          tag="$(git describe --tags --abbrev=0)"
          version="${tag#v}"
          echo "${{ secrets.RELEASE_TOKEN }}" | docker login git.illenium.net -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin
          if docker manifest inspect "${image}:${version}" >/dev/null 2>&1; then
            echo "${image}:${version} already published"
            exit 0
          fi
          git checkout --quiet "$tag"
          mvn -B -q package -DskipTests
          jar="$(ls target/*.jar | grep -v -E -- '-(sources|javadoc)\.jar$' | head -1)"
          ctx="$(mktemp -d)"
          cp "$jar" "${ctx}/${GITHUB_REPOSITORY#*/}.jar"
          printf 'FROM scratch\nCOPY *.jar /\n' > "${ctx}/Containerfile"
          docker build -f "${ctx}/Containerfile" \
            --label org.opencontainers.image.source="https://git.illenium.net/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="${version}" \
            -t "${image}:${version}" "$ctx"
          docker push "${image}:${version}"
