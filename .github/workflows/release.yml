name: Release CI

on:
  push:
    branches:
      - master
  # Lets a release be cut by hand — needed at least once after enabling Actions on a fork, since commits
  # pushed before that point never triggered anything.
  workflow_dispatch:

# semantic-release commits the version bump and changelog back, and creates the release.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # Disabling shallow clone is needed for correctly determing next release with semantic release
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Test
        run: mvn -B test
        
      - name: Build package
        run: mvn -B package -DskipTests


      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
          extra_plugins: |
            @semantic-release/changelog@6
            @terrestris/maven-semantic-release@2
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

